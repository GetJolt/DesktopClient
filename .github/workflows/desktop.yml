# Builds the desktop installers on each platform's own runner, since electron-builder can't cross-build them
# reliably. Run it by hand or push a desktop-v* tag, then copy the artifacts into apps/site/download.
name: Desktop release

on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@getjolt/desktop^...
      - run: pnpm --filter @getjolt/desktop release
      - uses: actions/upload-artifact@v4
        with:
          name: jolt-${{ runner.os }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/latest*.yml
          if-no-files-found: error
